[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturedeck"
version = "0.2.1"
description = "CPU-based hand gesture control for presentation slides"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==1.1.1",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.4.6",
    "PyAutoGUI==0.9.54",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
gesturedeck = "gesturedeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
